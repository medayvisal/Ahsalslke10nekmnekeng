          <label style="font-size:0.85rem;font-weight:600;">To: <input id="t" type="number" min="1" max="${Q.length}" value="${Q.length}" style="width:70px;padding:6px;border-radius:6px;border:1px solid var(--border);"></label>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <span style="font-size:0.75rem;color:var(--muted);align-self:center;">Presets:</span>
          <button class="preset-pill" onclick="setR(1,${Q.length})">All ${Q.length}</button>
          <button class="preset-pill" onclick="setR(1,50)">1–50</button>
          <button class="preset-pill" onclick="setR(51,100)">51–100</button>
          <button class="preset-pill" onclick="setR(101,150)">101–150</button>
          <button class="preset-pill" onclick="setR(151,200)">151–200</button>
          <button class="preset-pill" onclick="setR(201,250)">201–250</button>
          <button class="preset-pill" onclick="setR(251,${Q.length})">251–${Q.length}</button>
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:10px;margin:16px 0;font-size:0.9rem;cursor:pointer;">
        <input type="checkbox" id="ins" style="width:18px;height:18px;accent-color:var(--primary);">
        <div>
          <strong>${T("Show answer instantly","បង្ហាញចម្លើយភ្លាមៗ")}</strong>
          <div style="font-size:0.75rem;color:var(--muted);">Immediate green/red reveal with rationale during study.</div>
        </div>
      </label>

      <div class="btn-row" style="margin-top:20px;">
        <button class="btn pri" style="padding:12px 24px;font-size:0.95rem;" onclick="start()">▶ ${T("Start Quiz","ចាប់ផ្តើម")}</button>
        <button class="btn" onclick="keyScr()">🔑 ${T("Answer Key Editor","កែចម្លើយត្រូវ")}</button>
        <button class="btn" onclick="help()">ℹ️ ${T("User Guide","របៀបប្រើ")}</button>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function setMode(r) {
  S.rnd = r;
  $("#m-rnd").className = "mode-card " + (r ? "active" : "");
  $("#m-seq").className = "mode-card " + (!r ? "active" : "");
}

function setR(f, t) {
  $("#f").value = f;
  $("#t").value = t;
}

function start(idxList) {
  let r = S.rnd;
  if(!idxList) {
    let f = +$("#f").value || 1;
    let t = +$("#t").value || Q.length;
    if(f > t) [f, t] = [t, f];
    f = Math.max(1, f);
    t = Math.min(Q.length, t);
    idxList = [];
    for(let i = f - 1; i < t; i++) idxList.push(i);
    S.ins = $("#ins").checked;
  }
  if(r) idxList = shuf(idxList);
  S.items = idxList.map(i => ({ i, o: mkOrd(i, r) }));
  S.cur = 0;
  S.res = {};
  quiz();
}

function quiz(keepScroll) {
  const k = S.cur;
  const it = S.items[k];
  const q = Q[it.i];
  const r = S.res[k];
  const lock = S.ins && r !== undefined;
  const c = A(it.i);
  const N = S.items.length;

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span style="font-size:0.85rem;font-weight:700;color:var(--primary);">
          ${T("Question","សំណួរ")} ${k + 1} / ${N}
        </span>
        <span style="font-size:0.75rem;font-family:monospace;background:#f1f5f9;padding:2px 8px;border-radius:6px;font-weight:600;">
          Faculty #${q.o}
        </span>
      </div>

      <h2>${esc(q.q)}</h2>

      <div style="margin:16px 0;">
        ${it.o.map((origIdx, p) => {
          let cl = "opt-btn";
          if(lock) {
            if(origIdx === c) cl += " ok";
            else if(origIdx === r) cl += " bad";
          } else if(origIdx === r) {
            cl += " sel";
          }
          return `
            <button class="${cl}" onclick="pick(${origIdx})">
              <span class="badge">${L[p]}</span>
              <span style="padding-top:2px;">${esc(q.p[origIdx])}</span>
            </button>
          `;
        }).join("")}
      </div>

      <div class="btn-row">
        <button class="btn" ${k > 0 ? "" : "disabled"} onclick="S.cur--;quiz()">← ${T("Previous","មុន")}</button>
        <button class="btn" ${k < N - 1 ? "" : "disabled"} onclick="S.cur++;quiz()">${T("Next","បន្ទាប់")} →</button>
      </div>

      <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:0.8rem;font-weight:700;color:#334155;">
            ${T("Question Palette","ប្រអប់សំណួរ")}
          </span>
          <span style="font-size:0.75rem;color:var(--muted);">
            ${Object.keys(S.res).length}/${N} Answered
          </span>
        </div>
        <div class="grid-palette">
          ${S.items.map((_, j) => `
            <button class="pal-btn ${j === k ? "cur" : ""} ${S.res[j] !== undefined ? "done" : ""}" onclick="S.cur=${j};quiz()">
              ${j + 1}
            </button>
          `).join("")}
        </div>
      </div>

      <div class="btn-row" style="margin-top:20px;">
        <button class="btn pri" onclick="submit()">${T("Submit Quiz","បញ្ជូន")}</button>
        <button class="btn" onclick="home()">${T("Quit","ចាកចេញ")}</button>
      </div>
    </div>
  `;
  if(!keepScroll) window.scrollTo({ top: 0, behavior: "smooth" });
}

function pick(optIdx) {
  if(S.ins && S.res[S.cur] !== undefined) return;
  S.res[S.cur] = optIdx;
  quiz(true);
}

function submit() {
  let ok = 0, sk = 0;
  S.items.forEach((it, k) => {
    const r = S.res[k];
    if(r === undefined) sk++;
    else if(r === A(it.i)) ok++;
  });
  S.ok = ok;
  S.sk = sk;
  S.only = 0;
  result();
}

function result() {
  const n = S.items.length;
  const p = Math.round((S.ok / n) * 100);

  const rows = S.items.map((it, k) => {
    const q = Q[it.i];
    const r = S.res[k];
    const c = A(it.i);
    const g = r === c;
    if(S.only && g) return "";

    return `
      <div class="review-item ${g ? "good" : "wrong"}">
        <div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px;font-family:monospace;">
          #${k + 1} · Faculty #${q.o}
        </div>
        <div style="font-weight:700;margin-bottom:6px;font-size:0.95rem;">${esc(q.q)}</div>
        <div style="font-size:0.85rem;">
          ${T("Your answer","ចម្លើយអ្នក")}: <strong>${r === undefined ? "—" : esc(q.p[r])}</strong>
        </div>
        ${g ? "" : `
          <div style="font-size:0.85rem;color:var(--ok);margin-top:2px;">
            ${T("Correct answer","ចម្លើយត្រឹមត្រូវ")}: <strong>${esc(q.p[c])}</strong>
          </div>
        `}
      </div>
    `;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <div class="kicker">Examination Report</div>
      <h1>${T("Score","ពិន្ទុ")}: ${S.ok} / ${n} (${p}%)</h1>
      
      <div class="stats-row">
        <div class="stat-card ok">
          <div class="stat-lbl">${T("Correct","ត្រូវ")}</div>
          <div class="stat-val">${S.ok}</div>
        </div>
        <div class="stat-card bad">
          <div class="stat-lbl">${T("Wrong","ខុស")}</div>
          <div class="stat-val">${n - S.ok - S.sk}</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">${T("Skipped","មិនឆ្លើយ")}</div>
          <div class="stat-val">${S.sk}</div>
        </div>
      </div>

      <div class="btn-row" style="margin-top:20px;">
        <button class="btn pri" onclick="home()">${T("Home","ទំព័រដើម")}</button>
        <button class="btn" onclick="retry()">${T("Retry Wrong Only","ធ្វើឡើងវិញតែខុស")}</button>
        <button class="btn" onclick="S.only = !S.only; result()">${S.only ? T("Show All","បង្ហាញទាំងអស់") : T("Show Wrong Only","តែចម្លើយខុស")}</button>
      </div>

      <div style="margin-top:20px;">
        ${rows}
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function retry() {
  const w = S.items.filter((it, k) => S.res[k] !== A(it.i)).map(it => it.i);
  if(w.length) start(w);
}

function keyScr() {
  app.innerHTML = `
    <div class="card">
      <h1>${T("Answer Key Editor","កែចម្លើយត្រឹមត្រូវ")}</h1>
      <p class="subtext">${T("Click any option to set the correct answer. Overrides save automatically in browser memory.","ចុចជម្រើសដើម្បីកំណត់ចម្លើយត្រឹមត្រូវ។")}</p>

      <div class="btn-row">
        <button class="btn pri" onclick="home()">← ${T("Back","ត្រឡប់ក្រោយ")}</button>
        <button class="btn" onclick="expK()">${T("Export","នាំចេញ")}</button>
        <button class="btn" onclick="impK()">${T("Import","នាំចូល")}</button>
        <button class="btn" onclick="KEY={};saveK();fillKey()">${T("Reset","កំណត់ឡើងវិញ")}</button>
      </div>

      <textarea id="io" rows="2" style="width:100%;box-sizing:border-box;border-radius:8px;border:1px solid var(--border);font-family:monospace;padding:8px;" placeholder="CCAB… (${Q.length} letters A–D)"></textarea>
      <p id="msg" style="font-size:0.8rem;color:var(--primary);margin:4px 0 12px;font-weight:600;"></p>
      <input id="sq" type="text" placeholder="Search questions..." style="width:100%;box-sizing:border-box;border-radius:8px;border:1px solid var(--border);padding:8px 12px;" oninput="fillKey()">

      <div id="kl" style="margin-top:16px;"></div>
    </div>
  `;
  fillKey();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function fillKey() {
  const s = ($("#sq").value || "").toLowerCase();
  $("#kl").innerHTML = Q.map((x, i) => ({ x, i })).filter(({ x }) => !s || (x.n + " " + x.o + " " + x.q).toLowerCase().includes(s)).map(({ x, i }) => `
    <div class="review-item" style="margin-bottom:8px;">
      <div style="font-size:0.75rem;color:var(--muted);font-family:monospace;">${x.n} · Faculty #${x.o} ${KEY[x.n] !== undefined ? "✎ (Custom)" : ""}</div>
      <div style="font-weight:700;margin:4px 0 8px;">${esc(x.q)}</div>
      ${x.p.map((t, j) => `
        <button class="opt-btn ${A(i) === j ? "ok" : ""}" onclick="setK(${i}, ${j})" style="margin:4px 0;padding:10px 14px;">
          <span class="badge">${L[j]}</span>
          <span>${esc(t)}</span>
        </button>
      `).join("")}
    </div>
  `).join("");
}

function setK(i, j) {
  if(j === Q[i].a) delete KEY[Q[i].n];
  else KEY[Q[i].n] = j;
  saveK();
  fillKey();
}

function expK() {
  $("#io").value = Q.map((_, i) => L[A(i)]).join("");
  $("#io").select();
  $("#msg").textContent = "Key copied! Copy this text string.";
}

function impK() {
  const s = $("#io").value.toUpperCase().replace(/[^A-D]/g, "");
  if(s.length !== Q.length) {
    $("#msg").textContent = `Need ${Q.length} letters, got ${s.length}`;
    return;
  }
  KEY = {};
  [...s].forEach((c, i) => {
    const j = L.indexOf(c);
    if(j !== Q[i].a) KEY[Q[i].n] = j;
  });
  saveK();
  $("#msg").textContent = "Imported successfully ✓";
  fillKey();
}

function help() {
  app.innerHTML = `
    <div class="card">
      <h1>${T("How to Use ayvisalslkemnekeng10nek","របៀបប្រើ")}</h1>
      <ol style="padding-left:20px;line-height:1.7;font-size:0.9rem;">
        <li><strong>${T("Choose Mode","ជ្រើសរបៀប")}</strong>: Full Random shuffles questions & options; Original Order keeps syllabus sequence.</li>
        <li><strong>${T("Question Range","កំណត់ចន្លោះសំណួរ")}</strong>: Select question numbers or use quick presets (e.g. 1–50, All ${Q.length}).</li>
        <li><strong>${T("Instant Feedback","បង្ហាញចម្លើយភ្លាមៗ")}</strong>: Turn on to see right/wrong answers immediately as you practice.</li>
        <li><strong>${T("Review & Retry","មើលចម្លើយ និងធ្វើឡើងវិញ")}</strong>: After submitting, click "Retry Wrong Only" to master difficult questions.</li>
        <li><strong>${T("Answer Key","កែចម្លើយត្រូវ")}</strong>: Faculty and students can edit any question answer key with automatic browser saving.</li>
      </ol>
      <div class="btn-row">
        <button class="btn pri" onclick="home()">← ${T("Back to Home","ត្រឡប់ក្រោយ")}</button>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

home();
</script>
</body>
</html>
